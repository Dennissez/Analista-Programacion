<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPLACEX - WHO AM I? (Unidad 1)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; flex-direction: column; }

        /* ---------- BARRA DE PESTAÑAS ---------- */
        .tabbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #1a365d;
            flex: none;
        }
        .tabbar .brand {
            color: #cfe0f5;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: .03em;
            margin-right: auto;
        }
        .tab-link {
            border: none;
            background: transparent;
            color: #cfe0f5;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }
        .tab-link:hover { background: rgba(255,255,255,0.08); }
        .tab-link.active { background: #ffffff; color: #1a365d; }

        /* ---------- VISTAS ---------- */
        .view { flex: 1; min-height: 0; display: none; }
        .view.active { display: flex; }

        /* Vista 1: Documento + Audio */
        .pdf-section { flex: 7; height: 100%; border-right: 2px solid #ddd; }
        iframe { width: 100%; height: 100%; border: none; }

        .sidebar { flex: 3; padding: 25px; display: flex; flex-direction: column; background: #ffffff; overflow-y: auto; }
        h2 { color: #1a365d; margin-bottom: 5px; font-size: 1.4rem; }
        p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

        .audio-player { background: #eef2f7; padding: 15px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #dce4ec; }
        audio { width: 100%; margin-top: 10px; }

        .timestamps-title { font-size: 1.05rem; color: #2d3748; margin-bottom: 12px; }
        .timestamp-list { list-style: none; }
        .timestamp-list li { margin-bottom: 8px; }
        .timestamp-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            color: #2b6cb0;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timestamp-btn:hover { background: #ebf8ff; border-color: #3182ce; }
        .time-badge { background: #3182ce; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }

        /* Vista 2: Guía interactiva (cargada en iframe para no mezclar estilos) */
        #guideView iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- BARRA DE PESTAÑAS -->
    <div class="tabbar">
        <span class="brand">IPLACEX · Inglés Básico I · Unidad 1</span>
        <button class="tab-link active" id="tabDocBtn" onclick="switchView('doc')">📄 Documento + Audio</button>
        <button class="tab-link" id="tabGuideBtn" onclick="switchView('guide')">✨ Guía interactiva</button>
    </div>

    <!-- VISTA 1: PDF + AUDIOLIBRO -->
    <div class="view active" id="docView">
        <div class="pdf-section">
            <iframe src="ME_1.pdf"></iframe>
        </div>

        <div class="sidebar">
            <h2>Unidad 1: WHO AM I?</h2>
            <p class="subtitle">Inglés Básico - IPLACEX</p>

            <div class="audio-player">
                <strong>🎧 Audiolibro ME 1:</strong>
                <audio id="studyAudio" controls>
                    <source src="ME_1_Audiolibro.mp3" type="audio/mpeg">
                    Tu navegador no soporta el elemento de audio.
                </audio>
            </div>

            <h3 class="timestamps-title">📌 Saltar a un Tema:</h3>
            <ul class="timestamp-list">
                <li><button class="timestamp-btn" onclick="seekAudio(14)"><span>01. Introducción</span> <span class="time-badge">00:14</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(58,7)"><span>02. Ideas fuerza</span> <span class="time-badge">00:58</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(109)"><span>03. Pronombres Personales</span> <span class="time-badge">01:49</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(194)"><span>04. Saludos y Despedidas</span> <span class="time-badge">03:14</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(210,90)"><span>05. Saludos - Despedidas (Formal e Informal)</span> <span class="time-badge">03:31</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(225)"><span>06. Saludo Inicial/Respuestas</span> <span class="time-badge">03:45</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(245)"><span>07. Cómo continuar la conversación</span> <span class="time-badge">04:05</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(286)"><span>08. Presentarse a uno mismo y a terceros</span> <span class="time-badge">04:46</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(352)"><span>09. Al conocer a alguien</span> <span class="time-badge">05:52</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(397)"><span>10. Alphabet</span> <span class="time-badge">06:37</span></button></li>
                <li><button class="timestamp-btn" onclick="seekAudio(457)"><span>11. Conclusión</span> <span class="time-badge">07:37</span></button></li>
            </ul>
        </div>
    </div>

    <!-- VISTA 2: GUÍA INTERACTIVA -->
    <div class="view" id="guideView">
        <iframe src="who_am_i_guia_estudio.html" title="Guía interactiva"></iframe>
    </div>

    <script>
        function seekAudio(seconds) {
            const audio = document.getElementById('studyAudio');
            audio.currentTime = seconds;
            audio.play();
        }

        function switchView(view) {
            const docView = document.getElementById('docView');
            const guideView = document.getElementById('guideView');
            const tabDocBtn = document.getElementById('tabDocBtn');
            const tabGuideBtn = document.getElementById('tabGuideBtn');

            if (view === 'doc') {
                docView.classList.add('active');
                guideView.classList.remove('active');
                tabDocBtn.classList.add('active');
                tabGuideBtn.classList.remove('active');
            } else {
                guideView.classList.add('active');
                docView.classList.remove('active');
                tabGuideBtn.classList.add('active');
                tabDocBtn.classList.remove('active');
            }
        }
    </script>
</body>
</html>
