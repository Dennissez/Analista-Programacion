<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPLACEX - Primeros pasos con C# (Unidad 1)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: #f4f6f9; }
        
        /* Contenedor del PDF */
        .pdf-section { flex: 7; height: 100%; border-right: 2px solid #ddd; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Contenedor Lateral (Audio y Navegación) */
        .sidebar { flex: 3; padding: 25px; display: flex; flex-direction: column; background: #ffffff; overflow-y: auto; }
        h2 { color: #1a365d; margin-bottom: 5px; font-size: 1.4rem; }
        p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        
        /* Estilos del Reproductor */
        .audio-player { background: #eef2f7; padding: 15px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #dce4ec; }
        audio { width: 100%; margin-top: 10px; }
        
        /* Lista de Temas con Marcadores de Tiempo */
        .timestamps-title { font-size: 1.05rem; color: #2d3748; margin-bottom: 12px; }
        .timestamp-list { list-style: none; }
        .timestamp-list li { margin-bottom: 8px; }
        .timestamp-btn { 
            width: 100%; 
            text-align: left; 
            padding: 10px 12px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.88rem; 
            color: #2b6cb0;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timestamp-btn:hover { background: #ebf8ff; border-color: #3182ce; }
        .time-badge { background: #3182ce; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }

        /* ---------- BARRA DE PESTAÑAS ---------- */
        html, body { height: 100%; }
        body { flex-direction: column; }
        .tabbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #1a365d;
            flex: none;
        }
        .tabbar .brand {
            color: #cfe0f5;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: .03em;
            margin-right: auto;
        }
        .tab-link {
            border: none;
            background: transparent;
            color: #cfe0f5;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }
        .tab-link:hover { background: rgba(255,255,255,0.08); }
        .tab-link.active { background: #ffffff; color: #1a365d; }

        .view { flex: 1; min-height: 0; display: none; }
        .view.active { display: flex; }
        #guideView iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- BARRA DE PESTAÑAS -->
    <div class="tabbar">
        <span class="brand">IPLACEX · Programación I · Unidad 1</span>
        <button class="tab-link active" id="tabDocBtn" onclick="switchView('doc')">📄 Documento + Audio</button>
        <button class="tab-link" id="tabGuideBtn" onclick="switchView('guide')">✨ Guía interactiva</button>
    </div>

    <!-- VISTA 1: PDF + AUDIOLIBRO -->
    <div class="view active" id="docView">
    <!-- VISOR DE PDF (Lado Izquierdo) -->
    <div class="pdf-section">
        <iframe src="ME_2.pdf"></iframe>
    </div>

    <!-- PANEL LATERAL CON AUDIO (Lado Derecho) -->
    <div class="sidebar">
        <h2>Unidad 1: primeros pasos C#</h2>
        <p class="subtitle">Programación - IPLACEX</p>

        <!-- Reproductor de Audio -->
        <div class="audio-player">
            <strong>🎧 Audiolibro ME 2:</strong>
            <audio id="studyAudio" controls>
                <source src="ME_2_Audiolibro.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

        <!-- Atajos de Tiempo (Timestamps) -->
        <h3 class="timestamps-title">📌 Saltar a un Tema:</h3>
        <ul class="timestamp-list">
            <li><button class="timestamp-btn" onclick="seekAudio(14)"><span>01. Consideraciones Previas</span> <span class="time-badge">00:14</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(51)"><span>02. Introducción</span> <span class="time-badge">00:51</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(98)"><span>03. Ideas fuerza</span> <span class="time-badge">01:38</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(153)"><span>04. Polimorfismo</span> <span class="time-badge">02:33</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(212)"><span>05. Herencia</span> <span class="time-badge">03:32</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(382)"><span>06. Interface</span> <span class="time-badge">06:22</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(467)"><span>07. Colecciones</span> <span class="time-badge">07:47</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(514)"><span>08. List</span> <span class="time-badge">08:34</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(770)"><span>09. ArraList</span> <span class="time-badge">12:50</span></button></li>
            <li><button class="timestamp-btn" onclick="seekAudio(1000)"><span>10. Conclusión</span> <span class="time-badge">16:40</span></button></li>
        </ul>
    </div>
    </div>

    <!-- VISTA 2: GUÍA INTERACTIVA -->
    <div class="view" id="guideView">
        <iframe src="csharp_guia_estudio.html" title="Guía interactiva"></iframe>
    </div>

    <script>
        function seekAudio(seconds) {
            const audio = document.getElementById('studyAudio');
            audio.currentTime = seconds;
            audio.play();
        }

        function switchView(view) {
            const docView = document.getElementById('docView');
            const guideView = document.getElementById('guideView');
            const tabDocBtn = document.getElementById('tabDocBtn');
            const tabGuideBtn = document.getElementById('tabGuideBtn');

            if (view === 'doc') {
                docView.classList.add('active');
                guideView.classList.remove('active');
                tabDocBtn.classList.add('active');
                tabGuideBtn.classList.remove('active');
            } else {
                guideView.classList.add('active');
                docView.classList.remove('active');
                tabGuideBtn.classList.add('active');
                tabDocBtn.classList.remove('active');
            }
        }
    </script>
</body>
</html>
